<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hand-drawn route lines demo v3</title>
<style>
:root{--bg:#0A1317;--ink:#EEF3F4;--muted:#B3C4CA;--accent:#7CE0C3;--local:#F2B94B;--edge:rgba(255,255,255,.16)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 25% 15%,rgba(95,181,122,.18),transparent 55%),radial-gradient(ellipse at 80% 70%,rgba(224,138,60,.14),transparent 55%),var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;min-height:100vh;padding:28px 18px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(30px,6vw,46px);margin:0 0 6px}
p.sub{font-family:ui-monospace,"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
.wrap{max-width:900px;margin:0 auto}
.map{border:1px solid var(--edge);border-radius:6px;background:rgba(14,26,31,.58);padding:8px}
svg{width:100%;height:auto;display:block}
.grat line{stroke:rgba(255,255,255,.06)}
.dots circle{fill:rgba(255,255,255,.09)}
.route{fill:none;stroke:var(--accent);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.pin circle.o{fill:var(--bg);stroke:var(--local);stroke-width:2.4}
.pin circle.i{fill:var(--local)}
.pin{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.3);transition:opacity .25s,transform .4s cubic-bezier(.2,1.5,.5,1)}
.pin.show{opacity:1;transform:scale(1)}
.lab{opacity:0;transition:opacity .3s}.lab.show{opacity:1}
.lab text{fill:var(--ink);font:600 16px "Space Grotesk",system-ui,sans-serif}
.lab text.sm{fill:var(--muted);font:11px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}
.card{margin-top:12px;border:1px solid var(--edge);border-radius:4px;background:rgba(14,26,31,.8);padding:16px}
.kick{font:12px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#FF8A6B}
.card h2{font-size:22px;font-weight:600;margin:6px 0 4px}
.card p{margin:0 0 14px;color:var(--muted);font-size:14px;min-height:20px}
.nav{display:grid;grid-template-columns:52px 1fr 52px;gap:10px}
button{font:600 16px inherit;font-family:inherit;min-height:52px;border-radius:4px;border:1px solid var(--edge);background:transparent;color:var(--ink);cursor:pointer}
button:hover:not(:disabled){background:rgba(255,255,255,.1)}
button.go{background:var(--accent);border-color:var(--accent);color:#0A1317}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--local);outline-offset:2px}
.hint{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
</style></head><body>
<h1>Hand-drawn route lines</h1>
<p class="sub">Demo v3 · arrows draw only the leg between two stops</p>
<div class="wrap">
<div class="map"><svg id="svg" viewBox="0 0 1000 480" role="img" aria-label="Map showing the route between two trip destinations">
<defs><filter id="pencil" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter></defs>
<g class="grat" id="grat"></g><g class="dots" id="dots"></g>
<g filter="url(#pencil)"><path id="route" class="route" d="M0 0"/></g>
<g id="plane" opacity="0"><path d="M0-9 L3 -2 L11 3 L11 5 L3 3 L2 8 L5 10 L5 11 L0 10 L-5 11 L-5 10 L-2 8 L-3 3 L-11 5 L-11 3 L-3 -2 Z" fill="#EEF3F4" transform="rotate(90)"/></g>
<g id="pins"></g></svg></div>
<div class="card"><div class="kick" id="kick"></div><h2 id="title"></h2><p id="cap" aria-live="polite"></p>
<div class="nav"><button id="prev" type="button" aria-label="Previous destination">←</button><button class="go" type="button" id="open">Open the overview</button><button id="next" type="button" aria-label="Next destination">→</button></div>
<div class="hint">Use the arrow buttons or your ← → keys</div></div>
</div>
<script>
(function(){
var NS='http://www.w3.org/2000/svg',svg=document.getElementById('svg');
function xy(lon,lat){return [(lon+180)/360*1000,(80-lat)/140*480]}
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
var stops=[
{n:'Grand Tetons',s:'Wyoming',k:'Domestic · Mountain West',cap:'Canoeing on Jenny Lake with the Tetons overhead.',p:xy(-110.7,43.7)},
{n:'Puerto Rico',s:'6 days',k:'International · Caribbean',cap:'Old San Juan, Culebra, El Yunque, and the Bio Bay.',p:xy(-66.1,18.2)},
{n:'Peru',s:'2 weeks',k:'International · South America',cap:'Lima, the Amazon, Cusco, and the Inca Trail.',p:xy(-77,-12)},
{n:'Udaipur',s:'India',k:'International · Asia',cap:'Palaces, a lake boat ride, and vintage cars.',p:xy(73.7,24.6)},
{n:'Lake Kawaguchi',s:'Japan',k:'International · Asia',cap:'E-biking around the lake with Mount Fuji nearby.',p:xy(138.8,35.5)}];
var grat=document.getElementById('grat'),dots=document.getElementById('dots'),i,j;
for(i=1;i<12;i++)el('line',{x1:i*1000/12,x2:i*1000/12,y1:0,y2:480},grat);
for(i=1;i<6;i++)el('line',{y1:i*80,y2:i*80,x1:0,x2:1000},grat);
for(i=0;i<50;i++)for(j=0;j<24;j++)el('circle',{cx:10+i*20,cy:10+j*20,r:1.2},dots);
var pinsG=document.getElementById('pins'),route=document.getElementById('route'),plane=document.getElementById('plane');
stops.forEach(function(t,k){t.pin=el('g',{class:'pin'},pinsG);el('circle',{class:'o',cx:t.p[0],cy:t.p[1],r:8},t.pin);el('circle',{class:'i',cx:t.p[0],cy:t.p[1],r:3.5},t.pin);
 t.lab=el('g',{class:'lab'},pinsG);var up=t.p[1]<200;var a=el('text',{x:t.p[0],y:t.p[1]+(up?-22:30),'text-anchor':'middle'},t.lab);a.textContent=t.n;var b=el('text',{class:'sm',x:t.p[0],y:t.p[1]+(up?-8:44),'text-anchor':'middle'},t.lab);b.textContent=t.s});
var seed=5;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647-.5}
function leg(a,b){var d=Math.hypot(b[0]-a[0],b[1]-a[1]),arc=Math.min(120,d*.22),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2-arc,pts=[],n=46,t,x,y,w;for(var k=0;k<=n;k++){t=k/n;x=(1-t)*(1-t)*a[0]+2*(1-t)*t*mx+t*t*b[0];y=(1-t)*(1-t)*a[1]+2*(1-t)*t*my+t*t*b[1];w=Math.sin(t*Math.PI);pts.push([x+rnd()*2.6*w,y+rnd()*2.6*w])}return pts}
function toD(p){return 'M'+p.map(function(q){return q[0].toFixed(1)+' '+q[1].toFixed(1)}).join(' L')}
var cur=0,raf,reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches,prevBtn=document.getElementById('prev'),nextBtn=document.getElementById('next');
function text(){var t=stops[cur];document.getElementById('kick').textContent=t.k;document.getElementById('title').textContent=t.n;document.getElementById('cap').textContent=t.cap;prevBtn.disabled=cur===0;nextBtn.disabled=cur===stops.length-1}
function show(from,to,dir){cancelAnimationFrame(raf);
 stops.forEach(function(s,k){var on=k===from||k===to;s.lab.classList.toggle('show',on);s.pin.classList.toggle('show',on&&k===from)});
 plane.setAttribute('opacity',0);
 if(from===to){route.setAttribute('d','M0 0');stops[to].pin.classList.add('show');return}
 // route always stored left-stop -> right-stop order of travel
 var pts=leg(stops[from].p,stops[to].p);route.setAttribute('d',toD(pts));var L=route.getTotalLength();route.style.strokeDasharray=L;route.style.strokeDashoffset=reduce?0:L;
 if(reduce){stops[to].pin.classList.add('show');return}
 var st=null,dur=1500;function f(ts){if(!st)st=ts;var p=Math.min(1,(ts-st)/dur),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,len=L*e,a=route.getPointAtLength(len),b=route.getPointAtLength(Math.min(L,len+2));
  route.style.strokeDashoffset=L-len;plane.setAttribute('transform','translate('+a.x+' '+a.y+') rotate('+Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI+') scale(.8)');plane.setAttribute('opacity',p<1?1:0);
  if(p<1)raf=requestAnimationFrame(f);else stops[to].pin.classList.add('show')}
 raf=requestAnimationFrame(f)}
function step(d){var n=cur+d;if(n<0||n>=stops.length)return;var from=cur;cur=n;text();show(from,cur,d)}
prevBtn.addEventListener('click',function(){step(-1)});nextBtn.addEventListener('click',function(){step(1)});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'){step(1)}else if(e.key==='ArrowLeft'){step(-1)}});
text();show(0,0);
})();
</script></body></html>
