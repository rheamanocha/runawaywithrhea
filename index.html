<style>
/* Layout idea: a slim header over a full-bleed pan and zoom map; one floating trip card; single dark theme (Night map palette). */
:root {
  --bg: #0A1317;
  --ocean: #0E1A1F;
  --land: #17303A;
  --borders: #2B4A56;
  --graticule: #132830;
  --panel: #0E1A1F;
  --line: #2B424B;
  --ink: #E8EEF0;
  --muted: #9FB5BD;
  --field: #17303A;
  --photo: #2B4A55;
  --parks: #7CE0C3;
  --local: #F2B94B;
  --intl: #FF8A6B;
  --accent: #7CE0C3;
  --onaccent: #0E1A1F;
  --ring: #FFFFFF;
  --focus: #F2B94B;
  --display: "Space Grotesk", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--display); overflow: hidden; }
button, input { font-family: inherit; color: inherit; }
a { color: var(--ink); text-decoration: none; }
a:hover { color: var(--parks); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

#app { height: 100%; display: flex; flex-direction: column; }

.bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.logo { font-weight: 700; font-size: 20px; letter-spacing: 0.02em; padding: 8px 4px; }
.bar-right { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.seg { display: flex; gap: 6px; }
.seg button, .btn { min-height: 44px; padding: 8px 16px; font-size: 14px; font-weight: 500; background: transparent; border: 1px solid var(--line); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--onaccent); border-color: var(--accent); }
.search { display: flex; align-items: center; gap: 8px; }
.search label { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.search input { width: 170px; min-height: 44px; padding: 8px 12px; background: var(--field); border: 1px solid var(--line); font-size: 14px; }

#stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--bg); }
#map { position: absolute; inset: 0; cursor: grab; touch-action: none; }
#map.dragging { cursor: grabbing; }
#map:focus-visible { outline-offset: -4px; }
#world { position: absolute; left: 0; top: 0; width: 1600px; height: 820px; transform-origin: 0 0; --inv: 1; }
#world svg { display: block; width: 1600px; height: 820px; }
#routeSvg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
#routePath { fill: none; stroke: var(--accent, #7CE0C3); stroke-width: calc(2.6px * var(--inv)); stroke-linecap: round; stroke-linejoin: round; }
.sphere { fill: var(--ocean); stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.grat { fill: none; stroke: var(--graticule); stroke-width: 1; vector-effect: non-scaling-stroke; }
.land { fill: var(--land); stroke: var(--borders); stroke-width: 1; vector-effect: non-scaling-stroke; }
.borders { fill: none; stroke: var(--borders); stroke-width: 0.75; vector-effect: non-scaling-stroke; }

.pin { position: absolute; width: 0; height: 0; padding: 0; margin: 0; border: 0; background: none; overflow: visible; cursor: pointer; }
.pin[hidden] { display: none; }
.pin-inner { position: absolute; left: 0; top: 0; transform: scale(var(--inv)); transform-origin: 0 0; }
.hit { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; display: grid; place-items: center; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--line); background: var(--c); transition: transform 0.15s; }
.pin[aria-pressed="true"] .dot { transform: scale(1.35); border-color: var(--ring); }
.pin:focus-visible { outline: none; }
.pin:focus-visible .dot { outline: 3px solid var(--focus); outline-offset: 3px; }
.lab { position: absolute; left: 20px; top: -14px; padding: 4px 9px; font-size: 14px; line-height: 1.3; white-space: nowrap; background: var(--panel); border: 1px solid var(--line); display: none; }
#map.labels .lab, .pin[aria-pressed="true"] .lab { display: block; }
.parks { --c: var(--parks); }
.local { --c: var(--local); }
.intl { --c: var(--intl); }

.card { position: absolute; left: 16px; top: 16px; bottom: 16px; width: 360px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
.photo { flex: none; height: 150px; background: var(--photo); display: flex; align-items: flex-end; padding: 16px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
.card-body { flex: 1; min-height: 0; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.kind { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--c); }
.title { margin: 0; font-size: 28px; font-weight: 500; line-height: 1.15; text-wrap: balance; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fact { border: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.fact span:first-child { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.stops { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.stops li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.stops li span:last-child { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
.card-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
.cta { display: block; text-align: center; padding: 14px 22px; min-height: 48px; font-weight: 700; font-size: 15px; background: var(--accent); color: var(--onaccent); }
.cta:hover { color: var(--onaccent); opacity: 0.88; }
.cta.soon { background: transparent; color: var(--muted); border: 1px solid var(--line); cursor: default; }
.cta.soon:hover { color: var(--muted); opacity: 1; }
.tabs button { flex: 1; }
.card-foot { position: sticky; bottom: -22px; background: var(--panel); padding: 10px 0 22px; margin-bottom: -22px; }
.stops li a { display: flex; justify-content: space-between; gap: 12px; width: 100%; color: var(--ink); }
.stops li a:hover { color: var(--parks); }
.stops li { padding: 0; }
.stops li > span:first-child, .stops li > a { padding: 12px 0; }
.stops li > span:last-child { padding: 12px 0; }
.stops li a span:last-child { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
.stops li a:hover span:last-child { color: var(--parks); }
.posts li a span:last-child { text-transform: uppercase; font-size: 11px; letter-spacing: 0.08em; }
.mnav { display: flex; gap: 4px; margin-right: auto; margin-left: 20px; }
.mnav a { min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px; font-size: 14px; font-weight: 500; }
.mnav a[aria-current] { color: var(--parks); }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pager button { width: 48px; height: 48px; font-size: 20px; background: transparent; border: 1px solid var(--line); cursor: pointer; }
.counter { font-family: var(--mono); font-size: 13px; color: var(--muted); text-align: center; }
.empty { padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.empty p { margin: 0; font-size: 16px; line-height: 1.5; }

.tools { position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.legend { background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.legend div { display: flex; align-items: center; gap: 10px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; display: block; background: var(--c); }
.zoom { display: flex; border: 1px solid var(--line); background: var(--panel); }
.zoom button { min-width: 44px; height: 44px; padding: 0 12px; background: transparent; border: 0; font-size: 20px; cursor: pointer; }
.zoom button + button { border-left: 1px solid var(--line); }
.zoom .all { font-size: 14px; font-weight: 500; }
.hint { position: absolute; right: 16px; top: 16px; font-family: var(--mono); font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; }

@media (max-width: 820px) {
  .search input { width: 130px; }
  .card { left: 12px; right: 12px; top: auto; bottom: 12px; width: auto; height: min(46%, 380px); }
  .photo { display: none; }
  .tools { bottom: auto; top: 12px; right: 12px; }
  .legend { display: none; }
  .hint { display: none; }
}

/* Desktop: the panel is invisible plumbing; mobile: the menu button opens it */
.menu-btn { display: none; }
.menu-panel { display: contents; }
@media (max-width: 820px) {
  .bar { position: relative; z-index: 30; flex-wrap: nowrap; padding: 4px 12px; gap: 8px; }
  .logo { font-size: 17px; padding: 6px 2px; }
  .menu-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; background: transparent; border: 1px solid var(--line); font-size: 14px; font-weight: 500; cursor: pointer; }
  .menu-ico { width: 14px; height: 10px; background: linear-gradient(currentColor 0 0) top / 100% 2px no-repeat, linear-gradient(currentColor 0 0) center / 100% 2px no-repeat, linear-gradient(currentColor 0 0) bottom / 100% 2px no-repeat; }
  .menu-btn[aria-expanded="true"] { background: var(--accent); color: var(--onaccent); border-color: var(--accent); }
  .menu-panel { display: none; position: absolute; left: 0; right: 0; top: 100%; flex-direction: column; gap: 16px; padding: 12px 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: 0 18px 30px rgba(0,0,0,0.45); }
  .bar.open .menu-panel { display: flex; }
  .mnav { margin: 0; flex-direction: column; gap: 0; border-top: 1px solid var(--line); }
  .mnav a { padding: 0 4px; font-size: 16px; border-bottom: 1px solid var(--line); }
  .bar-right { flex-direction: column; align-items: stretch; gap: 12px; }
  .seg { flex-wrap: wrap; }
  .seg button { min-height: 40px; padding: 6px 12px; }
  .search { width: 100%; }
  .search input { flex: 1; width: auto; }
  /* Trip card: compact so the title, tabs, and list all fit */
  .card { height: min(48%, 400px); }
  .card-body { padding: 14px 16px 12px; gap: 10px; }
  .kind { font-size: 11px; }
  .title { font-size: 20px; line-height: 1.2; }
  .fact { padding: 6px 8px; }
  .tabs button { min-height: 36px; padding: 4px 12px; font-size: 13px; }
  .stops li { font-size: 14px; }
  .stops li > span:first-child, .stops li > a, .stops li > span:last-child { padding: 9px 0; }
  .card-body { padding-bottom: 0; }
  .card-foot { position: sticky; bottom: 0; margin: auto -16px 0; padding: 8px 16px 12px; flex-direction: row; align-items: center; gap: 8px; background: var(--panel); border-top: 1px solid var(--line); }
  .pager { display: contents; }
  .pager button { order: 0; width: 40px; height: 40px; font-size: 18px; flex: none; }
  #prev { order: 1; } .cta { order: 2; flex: 1; min-height: 40px; padding: 8px 12px; font-size: 14px; } #next { order: 3; }
  .counter { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .dot { transition: none; }
}

    { id: 'utah', cat: 'parks', label: 'Utah', name: 'Utah national parks', kind: 'National parks · Utah', title: 'The Mighty 5, in the right order', photo: 'Photo · Utah arch', zoom: 14,
      stops: [['Zion', '[Day]'], ['Bryce Canyon', '[Day]'], ['Capitol Reef', '[Day]'], ['Arches and Canyonlands', '[Day]']] },
    { id: 'bayarea', cat: 'local', label: 'Bay Area', name: 'San Francisco and the Bay Area', kind: 'Local trips · California', title: 'San Francisco and the Bay Area: food, hikes, and day trips', photo: 'Photo coming soon', zoom: 22,

      stops: [['Death Valley', 'Idea'], ['Joshua Tree weekend', 'Idea'], ['Tahoe in the summer and winter', 'Idea'], ['Mendocino', 'Idea'], ['Morro Bay, SLO, and Cambria', 'Idea'], ['Weekend in Ojai', 'Idea'], ['Kings Canyon', 'Idea']] },

    { id: 'nashville', cat: 'local', label: 'Nashville', name: 'Nashville', kind: 'Girls trip · Tennessee', title: 'Nashville girls trip itinerary', photo: 'Photo coming soon', zoom: 20,
      stops: [['Girls trip itinerary', 'Idea']] },
    { id: 'iceland', cat: 'intl', label: 'Iceland', name: 'Iceland', kind: 'International · Europe', title: 'Iceland in 7 days: the Ring Road', photo: 'Photo coming soon', zoom: 14,
      stops: [['7-day Ring Road itinerary', 'Idea']] },
    { id: 'spain', cat: 'intl', label: 'Spain', name: 'Spain', kind: 'International · Europe', title: 'Spain: Madrid, Barcelona, and Sevilla', photo: 'Photo coming soon', zoom: 14,
      stops: [['Madrid itinerary', 'Idea'], ['Barcelona itinerary, with a note on tourism', 'Idea'], ['Sevilla weekend', 'Idea']] },
    { id: 'portugal', cat: 'intl', label: 'Portugal', name: 'Portugal', kind: 'International · Europe', title: 'Portugal: Lisbon, Porto, and Lagos', photo: 'Photo coming soon', zoom: 16,
      stops: [['Lisbon itinerary', 'Idea'], ['Porto itinerary and where to stay', 'Idea'], ['Lagos itinerary', 'Idea']] },
    { id: 'dubai', cat: 'intl', label: 'Dubai', name: 'Dubai', kind: 'International · Middle East', title: 'Dubai: a solo weekend and general travel tips', photo: 'Photo coming soon', zoom: 22,
      stops: [['Solo weekend itinerary', 'Idea'], ['General travel tips', 'Idea']] },
    { id: 'delhi', cat: 'intl', label: 'Delhi', name: 'Delhi, India', kind: 'International · India', title: 'Delhi: top sights and where to eat', photo: 'Photo coming soon', zoom: 16,
      stops: [['Top tourist destinations', 'Idea'], ['Places to eat', 'Idea']] },
    { id: 'thailand', cat: 'intl', label: 'Thailand', name: 'Thailand', kind: 'International · Southeast Asia', title: 'Thailand in 10 days: Bangkok, Chiang Mai, and Krabi', photo: 'Photo coming soon', zoom: 12,
      stops: [['Bangkok', 'Idea'], ['Chiang Mai', 'Idea'], ['Krabi', 'Idea']] }
  ];
  var FILTERS = [['all', 'All'], ['parks', 'National parks'], ['local', 'Local'], ['intl', 'International']];

  var $ = function (id) { return document.getElementById(id); };
  var map = $('map'), world = $('world'), stage = $('stage'), card = $('card');
  var state = { tab: 'posts', filter: 'all', q: '', sel: TRIPS[0].id, view: { cx: 400, cy: 200, S: 1 }, area: { l: 0, t: 0, r: 100, b: 100 } };
  var anim = null;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Pins */
  var pinEls = {};
  TRIPS.forEach(function (t) {
    var p = PINS[t.id];
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'pin ' + t.cat;
    b.style.left = p[0] + 'px';
    b.style.top = p[1] + 'px';
    b.setAttribute('aria-label', t.name);
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<span class="pin-inner"><span class="hit"><span class="dot"></span></span><span class="lab"></span></span>';
    b.querySelector('.lab').textContent = t.label;
    b.addEventListener('click', function () { select(t.id, true); });
    world.appendChild(b);
    pinEls[t.id] = b;
  });

  /* Filter buttons */
  var filtersEl = $('filters');
  FILTERS.forEach(function (f) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = f[1];
    b.dataset.filter = f[0];
    b.addEventListener('click', function () { state.filter = f[0]; render(); showAll(); });
    filtersEl.appendChild(b);
  });

  /* Helpers */
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function visible() {
    var q = state.q.trim().toLowerCase();
    return TRIPS.filter(function (t) {
      return (state.filter === 'all' || t.cat === state.filter) &&
        (!q || (t.name + ' ' + t.title + ' ' + t.kind).toLowerCase().indexOf(q) !== -1);
    });
  }
  function current() {
    var v = visible();
    for (var i = 0; i < v.length; i++) { if (v[i].id === state.sel) return v[i]; }
    return v[0] || null;
  }
  function minScale() { return Math.max(0.3, Math.min(map.clientWidth / W, map.clientHeight / H) * 0.8); }
  var MAXS = 40;

  function updateArea() {
    var sr = stage.getBoundingClientRect();
    var cr = card.getBoundingClientRect();
    if (window.innerWidth > 820) {
      state.area = { l: cr.right - sr.left + 24, t: 24, r: sr.width - 24, b: sr.height - 24 };
    } else {
      state.area = { l: 12, t: 60, r: sr.width - 12, b: cr.top - sr.top - 12 };
    }
  }
  function apply() {
    var a = state.area, v = state.view;
    var acx = (a.l + a.r) / 2, acy = (a.t + a.b) / 2;
    world.style.transform = 'translate(' + (acx - v.cx * v.S) + 'px,' + (acy - v.cy * v.S) + 'px) scale(' + v.S + ')';
    world.style.setProperty('--inv', String(1 / v.S));
    map.classList.toggle('labels', v.S >= 4);
  }
  function stopAnim() { if (anim) { cancelAnimationFrame(anim); anim = null; } }
  function flyTo(cx, cy, S, done) {
    stopAnim();
    S = clamp(S, minScale(), MAXS);
    var from = { cx: state.view.cx, cy: state.view.cy, l: Math.log(state.view.S) };
    var to = { cx: clamp(cx, 0, W), cy: clamp(cy, 0, H), l: Math.log(S) };
    if (reduce) { state.view = { cx: to.cx, cy: to.cy, S: S }; apply(); if (done) done(); return; }
    var t0 = performance.now(), dur = 700;
    function step(now) {
      var k = clamp((now - t0) / dur, 0, 1);
      var e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      state.view = { cx: from.cx + (to.cx - from.cx) * e, cy: from.cy + (to.cy - from.cy) * e, S: Math.exp(from.l + (to.l - from.l) * e) };
      apply();
      anim = k < 1 ? requestAnimationFrame(step) : null;
      if (k >= 1 && done) done();
    }
    anim = requestAnimationFrame(step);
  }
  function showAll() {
    clearRoute();
    var v = visible();
    if (!v.length) return;
    if (v.length === 1) { var p = PINS[v[0].id]; flyTo(p[0], p[1], v[0].zoom); return; }
    var xs = v.map(function (t) { return PINS[t.id][0]; });
    var ys = v.map(function (t) { return PINS[t.id][1]; });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var a = state.area, pad = 70;
    var bw = Math.max(x1 - x0, 1), bh = Math.max(y1 - y0, 1);
    var S = Math.min((a.r - a.l - 2 * pad) / bw, (a.b - a.t - 2 * pad) / bh);
    flyTo((x0 + x1) / 2, (y0 + y1) / 2, S);
  }
  function select(id, fly) {
    state.sel = id;
    render();
    if (fly) {
      clearRoute();
      var t = current();
      if (t) flyTo(PINS[t.id][0], PINS[t.id][1], t.zoom);
    }
  }
  /* Hand-drawn route line between the previous and next trip, drawn when the pager arrows are used */
  var routePath = $('routePath'), routePlane = $('routePlane'), routeTok = 0, routeRaf = null;
  function clearRoute() {
    routeTok++;
    if (routeRaf) { cancelAnimationFrame(routeRaf); routeRaf = null; }
    routePath.setAttribute('d', '');
    routePlane.setAttribute('opacity', '0');
  }
  function legPoints(a, b) {
    var d = Math.hypot(b[0] - a[0], b[1] - a[1]), arc = Math.min(170, d * 0.22);
    var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2 - arc, n = 80, i, pts = [];
    for (i = 0; i <= n; i++) {
      var t = i / n, u = 1 - t;
      pts.push([u * u * a[0] + 2 * u * t * mx + t * t * b[0], u * u * a[1] + 2 * u * t * my + t * t * b[1]]);
    }
    return pts;
  }
  function travel(from, to) {
    clearRoute();
    var tok = routeTok, a = PINS[from.id], b = PINS[to.id], ar = state.area, pad = 90, started = false;
    var S = Math.min((ar.r - ar.l - 2 * pad) / Math.max(Math.abs(a[0] - b[0]), 1), (ar.b - ar.t - 2 * pad) / Math.max(Math.abs(a[1] - b[1]), 1));
    S = Math.min(S, Math.max(from.zoom, to.zoom));
    function arrive() { if (tok === routeTok) flyTo(b[0], b[1], to.zoom); }
    function draw() {
      var pts = legPoints(a, b);
      routePath.setAttribute('d', 'M' + pts.map(function (q) { return q[0].toFixed(1) + ' ' + q[1].toFixed(1); }).join(' L'));
      var L = routePath.getTotalLength();
      routePath.style.strokeDasharray = L;
      if (reduce) { routePath.style.strokeDashoffset = 0; arrive(); return; }
      routePath.style.strokeDashoffset = L;
      var t0 = performance.now(), dur = clamp(900 + L, 1100, 2000);
      function frame(now) {
        if (tok !== routeTok) return;
        var k = clamp((now - t0) / dur, 0, 1), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2, len = L * e;
        var p1 = routePath.getPointAtLength(len), p2 = routePath.getPointAtLength(Math.min(L, len + 2));
        routePath.style.strokeDashoffset = L - len;
        routePlane.setAttribute('transform', 'translate(' + p1.x + ' ' + p1.y + ') rotate(' + (Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI) + ') scale(' + (0.8 / state.view.S) + ')');
        routePlane.setAttribute('opacity', k < 1 ? '1' : '0');
        if (k < 1) { routeRaf = requestAnimationFrame(frame); } else { routeRaf = null; arrive(); }
      }
      routeRaf = requestAnimationFrame(frame);
    }
    function begin() { if (started || tok !== routeTok) return; started = true; draw(); }
    flyTo((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, S, begin);
    setTimeout(begin, reduce ? 0 : 800);
  }
  function step(dir) {
    var v = visible();
    if (!v.length) return;
    var cur = current();
    var i = v.indexOf(cur);
    var next = v[(i + dir + v.length) % v.length];
    if (!cur || next.id === cur.id) { select(next.id, true); return; }
    select(next.id, false);
    travel(cur, next);
  }

  /* Render UI from state */
  function render() {
    var v = visible(), cur = current();
    state.sel = cur ? cur.id : state.sel;
    TRIPS.forEach(function (t) {
      var el = pinEls[t.id];
      el.hidden = v.indexOf(t) === -1;
      el.setAttribute('aria-pressed', cur && cur.id === t.id ? 'true' : 'false');
    });
    Array.prototype.forEach.call(filtersEl.children, function (b) {
      b.setAttribute('aria-pressed', b.dataset.filter === state.filter ? 'true' : 'false');
    });
    var has = !!cur;
    $('cardBody').hidden = !has;
    $('photo').hidden = !has;
    $('empty').hidden = has;
    if (!has) return;
    card.style.setProperty('--c', 'var(--' + cur.cat + ')');
    var ph = $('photo');
    ph.textContent = cur.photo;
    ph.style.backgroundImage = cur.img ? 'linear-gradient(to top, rgba(10,19,23,.75), rgba(10,19,23,0) 60%), url(' + cur.img + ')' : '';
    ph.style.backgroundSize = 'cover'; ph.style.backgroundPosition = 'center';
    var cta = $('guide');
    if (cur.url) { cta.href = cur.url; cta.target = '_blank'; cta.rel = 'noopener'; cta.removeAttribute('aria-disabled'); cta.textContent = (cur.posts && cur.posts.length > 1) ? 'Open the overview' : 'Open full guide'; cta.classList.remove('soon'); }
    else { cta.removeAttribute('href'); cta.removeAttribute('target'); cta.setAttribute('aria-disabled', 'true'); cta.textContent = 'Guide coming soon'; cta.classList.add('soon'); }
    $('kind').textContent = cur.kind;
    $('title').textContent = cur.title;
    var ul = $('stops'), pl = $('posts');
    function row(parent, s, arrow, iconOnly) {
      var li = document.createElement('li');
      if (s[2]) {
        var a = document.createElement('a'); a.href = s[2]; a.target = '_blank'; a.rel = 'noopener';
        var n = document.createElement('span'); n.textContent = s[0];
        var m = document.createElement('span');
        if (iconOnly) { m.textContent = '\u2197'; m.setAttribute('aria-hidden', 'true'); a.setAttribute('aria-label', s[0] + ' (' + s[1] + ')'); } else { m.textContent = s[1] + (arrow ? ' \u2197' : ''); }
        a.appendChild(n); a.appendChild(m); li.appendChild(a);
      } else {
        var a2 = document.createElement('span'); a2.textContent = s[0];
        li.appendChild(a2);
        if (iconOnly) { a2.setAttribute('title', s[1]); } else { var b2 = document.createElement('span'); b2.textContent = s[1]; li.appendChild(b2); }
      }
      parent.appendChild(li);
    }
    ul.textContent = ''; pl.textContent = '';
    cur.stops.forEach(function (s) { row(ul, s, true, true); });
    var many = cur.posts && cur.posts.length > 1;
    if (many) { cur.posts.forEach(function (p) { row(pl, p, true, true); }); }
    $('tabs').hidden = !many;
    $('tabPosts').textContent = many ? 'Guides \u00b7 ' + cur.posts.length : '';
    /* Guides is the default tab for every trip; only keep Stops if the visitor picked it on this same trip */
    if (state.lastTrip !== cur.id) state.tab = 'posts';
    state.lastTrip = cur.id;
    showTab(many && state.tab !== 'stops' ? 'posts' : 'stops');
    if (!many) state.tab = 'posts';
    $('counter').textContent = 'Trip ' + (v.indexOf(cur) + 1) + ' of ' + v.length;
    $('prev').disabled = $('next').disabled = v.length < 2;
  }

  function showTab(w) {
    state.tab = w;
    $('stops').hidden = w === 'posts';
    $('posts').hidden = w !== 'posts';
    $('tabStops').setAttribute('aria-pressed', w === 'stops' ? 'true' : 'false');
    $('tabPosts').setAttribute('aria-pressed', w === 'posts' ? 'true' : 'false');
  }
  $('tabStops').addEventListener('click', function () { showTab('stops'); });
  $('tabPosts').addEventListener('click', function () { showTab('posts'); });

  /* Controls */
  $('prev').addEventListener('click', function () { step(-1); });
  $('next').addEventListener('click', function () { step(1); });
  $('search').addEventListener('input', function (e) { state.q = e.target.value; render(); showAll(); });
  $('clear').addEventListener('click', function () { state.q = ''; state.filter = 'all'; $('search').value = ''; render(); showAll(); });
  function zoomBy(f, px, py) {
    stopAnim();
    var a = state.area, v = state.view;
    var acx = (a.l + a.r) / 2, acy = (a.t + a.b) / 2;
    var ox = (px === undefined ? acx : px), oy = (py === undefined ? acy : py);
    var S2 = clamp(v.S * f, minScale(), MAXS);
    var mx = v.cx + (ox - acx) / v.S, my = v.cy + (oy - acy) / v.S;
    state.view = { cx: clamp(mx - (ox - acx) / S2, 0, W), cy: clamp(my - (oy - acy) / S2, 0, H), S: S2 };
    apply();
  }
  $('zin').addEventListener('click', function () { zoomBy(1.6); });
  $('zout').addEventListener('click', function () { zoomBy(1 / 1.6); });
  $('zall').addEventListener('click', showAll);

  /* Pointer pan and wheel zoom */
  var drag = null;
  map.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('.pin')) return;
    stopAnim();
    drag = { x: e.clientX, y: e.clientY };
    map.classList.add('dragging');
    try { map.setPointerCapture(e.pointerId); } catch (err) {}
  });
  map.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    var v = state.view;
    state.view = { cx: clamp(v.cx - dx / v.S, 0, W), cy: clamp(v.cy - dy / v.S, 0, H), S: v.S };
    apply();
  });
  function endDrag() { drag = null; map.classList.remove('dragging'); }
  map.addEventListener('pointerup', endDrag);
  map.addEventListener('pointercancel', endDrag);
  map.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = map.getBoundingClientRect();
    zoomBy(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  map.addEventListener('keydown', function (e) {
    if (e.target !== map) return;
    var v = state.view, d = 80 / v.S, handled = true;
    stopAnim();
    if (e.key === 'ArrowLeft') state.view = { cx: clamp(v.cx - d, 0, W), cy: v.cy, S: v.S };
    else if (e.key === 'ArrowRight') state.view = { cx: clamp(v.cx + d, 0, W), cy: v.cy, S: v.S };
    else if (e.key === 'ArrowUp') state.view = { cx: v.cx, cy: clamp(v.cy - d, 0, H), S: v.S };
    else if (e.key === 'ArrowDown') state.view = { cx: v.cx, cy: clamp(v.cy + d, 0, H), S: v.S };
    else if (e.key === '+' || e.key === '=') { zoomBy(1.6); return; }
    else if (e.key === '-' || e.key === '_') { zoomBy(1 / 1.6); return; }
    else if (e.key === '0') { showAll(); return; }
    else handled = false;
    if (handled) { e.preventDefault(); apply(); }
  });

  window.addEventListener('resize', function () { updateArea(); apply(); });


  /* Mobile menu */
  var bar = document.querySelector('.bar'), menuBtn = $('menuBtn');
  function setMenu(o) { bar.classList.toggle('open', o); menuBtn.setAttribute('aria-expanded', o ? 'true' : 'false'); }
  menuBtn.addEventListener('click', function () { setMenu(!bar.classList.contains('open')); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setMenu(false); });
  document.addEventListener('click', function (e) { if (!bar.contains(e.target)) setMenu(false); });
  window.addEventListener('resize', function () { if (window.innerWidth > 820) setMenu(false); });

  /* Start: all trips in view, first trip selected */
  updateArea();
  render();
  var v0 = visible(), xs0 = v0.map(function (t) { return PINS[t.id][0]; }), ys0 = v0.map(function (t) { return PINS[t.id][1]; });
  var bx0 = Math.min.apply(null, xs0), bx1 = Math.max.apply(null, xs0), by0 = Math.min.apply(null, ys0), by1 = Math.max.apply(null, ys0);
  var a0 = state.area;
  var S0 = clamp(Math.min((a0.r - a0.l - 140) / Math.max(bx1 - bx0, 1), (a0.b - a0.t - 140) / Math.max(by1 - by0, 1)), minScale(), MAXS);
  state.view = { cx: (bx0 + bx1) / 2, cy: (by0 + by1) / 2, S: S0 };
  apply();
})();
