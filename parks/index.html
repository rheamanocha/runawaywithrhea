/* Layout idea: a layered guide. A blurred, darkened copy of the hero photo sits fixed behind everything; content floats on glass panels above it; the hero photo, title card and fact tiles overlap; parallax photo bands break the sections. Night map palette with a warm amber ornament. */
:root {

  --display: "Space Grotesk", system-ui, sans-serif;
  --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 96px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--display); font-size: 17px; line-height: 1.65; overflow-x: hidden; }
a { color: var(--parks); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.1; font-family: var(--serif); font-weight: 600; }
p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
[hidden] { display: none !important; }

/* Fixed ambient layer: the hero photo, blurred and darkened */
.ambient { position: fixed; inset: -10%; z-index: -1; background: #0A1317 radial-gradient(ellipse at 25% 15%, #5FB57A 0%, transparent 55%), radial-gradient(ellipse at 80% 70%, #E08A3C 0%, transparent 55%), linear-gradient(160deg, #2f6b5a, #4a3322) center / cover no-repeat; filter: blur(70px) saturate(1.3) brightness(0.42); transform: translateZ(0); }

/* Glass surface */
.glass { background: linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.02) 55%), var(--glass); -webkit-backdrop-filter: blur(24px) saturate(1.5); backdrop-filter: blur(24px) saturate(1.5); border: 1px solid var(--edge); border-radius: 6px; box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 6px 18px rgba(0, 0, 0, 0.22); }

.wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; position: relative; }

/* Floating glass navigation */

/* Hero */
.hero-wrap { position: relative; height: 560px; overflow: hidden; }
.hero-img { position: absolute; left: 0; top: -40px; width: 100%; height: calc(100% + 80px); object-fit: cover; object-position: center 40%; will-change: transform; }

/* Photos */
.gal { display: flex; flex-wrap: wrap; gap: 6px; }
.gal::after { content: ""; flex-grow: 1000000; }
.ph { flex: calc(var(--ar) * 100) 1 calc(var(--ar) * 170px); min-width: 0; margin: 0; padding: 0; border: 0; background: rgba(255, 255, 255, 0.05); cursor: zoom-in; display: block; border-radius: 4px; overflow: hidden; position: relative; }
.ph img { display: block; width: 100%; height: auto; aspect-ratio: var(--ar); object-fit: cover; transition: transform 0.5s, opacity 0.2s; }
.ph:hover img { transform: scale(1.04); }
.strip { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 4px; padding: 4px 4px 0 4px; }
.sq { flex: none; aspect-ratio: 1 / 1; border-radius: 6px; }

.sq[data-more]::after { content: attr(data-more); position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10, 19, 23, 0.66); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); font-weight: 700; font-size: 22px; color: var(--ink); }
.banner { display: block; width: 100%; aspect-ratio: 16 / 7; border-radius: 6px; flex: none; }
.banner img { height: 100%; aspect-ratio: auto; }

/* Parallax photo band with a glass caption */
.band { position: relative; height: 380px; border-radius: 6px; overflow: hidden; border: 1px solid var(--edge); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45); }

<script>
(function () {
  /* Photo viewer */
  var dlg = document.getElementById('lb');
  var img = document.getElementById('lbImg');
  var cap = document.getElementById('lbCap');
  var photos = Array.prototype.slice.call(document.querySelectorAll('.ph'));
  var cur = 0;
  function show(i) {
    cur = (i + photos.length) % photos.length;
    var p = photos[cur];
    img.src = p.getAttribute('data-full');
    img.alt = p.getAttribute('data-alt') || '';
    cap.textContent = (p.getAttribute('data-alt') || '') + ' (' + (cur + 1) + ' of ' + photos.length + ')';
  }
  photos.forEach(function (p, i) {
    p.addEventListener('click', function () {
      show(i);
      if (dlg.showModal) { dlg.showModal(); } else { dlg.setAttribute('open', ''); }
    });
  });
  document.getElementById('lbClose').addEventListener('click', function () { dlg.close(); });
  document.getElementById('lbPrev').addEventListener('click', function () { show(cur - 1); });
  document.getElementById('lbNext').addEventListener('click', function () { show(cur + 1); });
  dlg.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { show(cur - 1); }
    else if (e.key === 'ArrowRight') { show(cur + 1); }
  });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) { dlg.close(); } });

  /* Parallax for the hero photo and the photo bands */
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { return; }
  var hero = document.getElementById('heroImg');
  var bands = Array.prototype.slice.call(document.querySelectorAll('.band img'));
  var ticking = false;
  function frame() {
    ticking = false;
    var vh = window.innerHeight || 800;
    if (hero) {
      var y = Math.min(window.scrollY || 0, 900);
      hero.style.transform = 'translate3d(0,' + (y * 0.22).toFixed(1) + 'px,0)';
    }
    bands.forEach(function (b) {
      var r = b.parentNode.getBoundingClientRect();
      if (r.bottom < -100 || r.top > vh + 100) { return; }
      var p = ((r.top + r.height / 2) - vh / 2) / vh;
      b.style.transform = 'translate3d(0,' + (-p * 60).toFixed(1) + 'px,0)';
    });
  }
  function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(frame); } }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  frame();
})();

</script>
</body>
</html>
